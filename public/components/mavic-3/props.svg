<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" direction="rtl" font-family="'Google Sans', 'Noto Sans Hebrew', 'Segoe UI', Arial, sans-serif" text-anchor="start">
  <title>רכיבים בפירוק · התקנת מדחפים · MAVIC 3</title>
  <rect width="1200" height="750" fill="#F4F7FC"/>
  <rect width="1200" height="170" fill="#D97706"/>
  <circle cx="90" cy="20" r="140" fill="#fff" opacity="0.08"/>
  <circle cx="230" cy="190" r="90" fill="#fff" opacity="0.07"/>
  <text x="1152" y="62" font-size="22" font-weight="700" fill="#fff" opacity="0.85">רכיבים בפירוק · ⁨MAVIC 3⁩</text>
  <text x="1152" y="122" font-size="50" font-weight="800" fill="#fff">התקנת מדחפים</text>
  <text x="48" y="122" font-size="20" font-weight="600" fill="#fff" opacity="0.85" text-anchor="end">4 רכיבים</text>
  
  <g>
    <rect x="612" y="206" width="540" height="168" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="1082" cy="276" r="46" fill="#FFF4E0"/>
    <g transform="translate(1050 244)"><g fill="none" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="17" rx="7" ry="14"/><ellipse cx="32" cy="47" rx="7" ry="14"/><circle cx="32" cy="32" r="6" fill="#D97706"/></g></g>
    <text x="1014" y="252" font-size="25" font-weight="700" fill="#0B2149">מדחף (פרופלור)</text>
    <text x="1014" y="286" font-size="19" fill="#475569">יוצר את כוח העילוי. לכל מדחף כיוון</text>
    <text x="1014" y="314" font-size="19" fill="#475569">סיבוב משלו — לכן הוא מתאים רק למנוע</text>
    <text x="1014" y="342" font-size="19" fill="#475569">אחד.</text>
  </g>

  <g>
    <rect x="48" y="206" width="540" height="168" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="276" r="46" fill="#FFF4E0"/>
    <g transform="translate(486 244)"><g fill="none" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="32" y1="8" x2="32" y2="19"/><ellipse cx="32" cy="22" rx="15" ry="5"/><path d="M17 22 V48 Q32 56 47 48 V22"/><line x1="17" y1="34" x2="47" y2="34" stroke-dasharray="3 4"/></g></g>
    <text x="450" y="252" font-size="25" font-weight="700" fill="#0B2149">מנוע</text>
    <text x="450" y="286" font-size="19" fill="#475569">מסובב את המדחף במהירות גבוהה מאוד.</text>
    <text x="450" y="314" font-size="19" fill="#475569">לא נוגעים בו כשהרחפן דולק.</text>
  </g>

  <g>
    <rect x="612" y="398" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="1082" cy="468" r="46" fill="#FFF4E0"/>
    <g transform="translate(1050 436)"><g fill="none" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="32" rx="11" ry="25"/><line x1="22" y1="22" x2="42" y2="22" stroke="#E3132B" stroke-width="6"/><circle cx="32" cy="32" r="4" fill="#D97706"/></g></g>
    <text x="1014" y="444" font-size="25" font-weight="700" fill="#0B2149">סימון התאמה</text>
    <text x="1014" y="478" font-size="19" fill="#475569">סימון על המדחף ועל המנוע: מסומן עם</text>
    <text x="1014" y="506" font-size="19" fill="#475569">מסומן, לא מסומן עם לא מסומן.</text>
  </g>

  <g>
    <rect x="48" y="398" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="468" r="46" fill="#FFF4E0"/>
    <g transform="translate(486 436)"><g fill="none" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 32 A18 18 0 1 1 40 16"/><polyline points="33,11 40,16 35,23"/><circle cx="32" cy="32" r="6" fill="#D97706"/></g></g>
    <text x="450" y="444" font-size="25" font-weight="700" fill="#0B2149">מנגנון נעילה</text>
    <text x="450" y="478" font-size="19" fill="#475569">לחיצה וסיבוב נועלים את המדחף. מדחף</text>
    <text x="450" y="506" font-size="19" fill="#475569">שלא ננעל עד הסוף עלול לעוף בטיסה.</text>
  </g>
  <rect x="48" y="570" width="1104" height="132" rx="20" fill="#FFFBF0" stroke="#FCEBC0" stroke-width="2"/>
  <g transform="translate(1088 617)"><path d="M20 3 L38 35 H2 Z" fill="#FFC60A" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/><line x1="20" y1="14" x2="20" y2="24" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="30" r="2.2" fill="#78350F"/></g>
  <text x="1068" y="618" font-size="22" font-weight="800" fill="#78350F">תזכורת בטיחות — עוצרים ובודקים לפני שמתחילים</text><text x="1068" y="652" font-size="19" fill="#92400E">רחפן כבוי וסוללה בחוץ לפני כל מגע · עובדים עם הכלי המתאים ובלי כוח · כל בורג חוזר למקומו · לא</text><text x="1068" y="680" font-size="19" fill="#92400E">נוגעים בעדשה ובמגעים</text>
</svg>
