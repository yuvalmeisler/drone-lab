    <g transform="translate(1050 408)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="14" y1="14" x2="50" y2="50"/><line x1="50" y1="14" x2="14" y2="50"/><circle cx="14" cy="14" r="6" fill="#fff"/><circle cx="50" cy="14" r="6" fill="#fff"/><circle cx="14" cy="50" r="6" fill="#fff"/><circle cx="50" cy="50" r="6" fill="#fff"/><rect x="23" y="23" width="18" height="18" rx="5" fill="#fff"/></g></g>
    <text x="1014" y="416" font-size="25" font-weight="700" fill="#0B2149">תושבת הגימבל</text>
    <text x="1014" y="450" font-size="19" fill="#475569">נקודת החיבור בגוף הרחפן. הגימבל</text>
    <text x="1014" y="478" font-size="19" fill="#475569">נשלף ממנה בהטיה עדינה, לא במשיכה.</text>
  </g>

  <g>
    <rect x="48" y="370" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="440" r="46" fill="#FFF0E6"/>
    <g transform="translate(486 408)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="6" width="14" height="24" rx="6"/><line x1="29" y1="12" x2="29" y2="24"/><line x1="35" y1="12" x2="35" y2="24"/><line x1="32" y1="30" x2="32" y2="52"/><line x1="28" y1="56" x2="36" y2="52"/></g></g>
    <text x="450" y="416" font-size="25" font-weight="700" fill="#0B2149">מברג דיוק</text>
    <text x="450" y="450" font-size="19" fill="#475569">מברג קטן שמתאים בדיוק לראש הבורג —</text>
    <text x="450" y="478" font-size="19" fill="#475569">כדי לא להבריש אותו.</text>
  </g>
  <rect x="48" y="542" width="1104" height="132" rx="20" fill="#FFFBF0" stroke="#FCEBC0" stroke-width="2"/>
  <g transform="translate(1088 589)"><path d="M20 3 L38 35 H2 Z" fill="#FFC60A" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/><line x1="20" y1="14" x2="20" y2="24" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="30" r="2.2" fill="#78350F"/></g>
  <text x="1068" y="590" font-size="22" font-weight="800" fill="#78350F">תזכורת בטיחות — עוצרים ובודקים לפני שמתחילים</text><text x="1068" y="624" font-size="19" fill="#92400E">רחפן כבוי וסוללה בחוץ לפני כל מגע · עובדים עם הכלי המתאים ובלי כוח · כל בורג חוזר למקומו · לא</text><text x="1068" y="652" font-size="19" fill="#92400E">נוגעים בעדשה ובמגעים</text>
</svg>
