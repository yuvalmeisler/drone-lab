<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 722" width="1200" height="722" direction="rtl" font-family="'Google Sans', 'Noto Sans Hebrew', 'Segoe UI', Arial, sans-serif" text-anchor="start">
  <title>רכיבים בפירוק · פירוק גימבל · EVO</title>
  <rect width="1200" height="722" fill="#F4F7FC"/>
  <rect width="1200" height="170" fill="#F46A1F"/>
  <circle cx="90" cy="20" r="140" fill="#fff" opacity="0.08"/>
  <circle cx="230" cy="190" r="90" fill="#fff" opacity="0.07"/>
  <text x="1152" y="62" font-size="22" font-weight="700" fill="#fff" opacity="0.85">רכיבים בפירוק · ⁨EVO⁩</text>
  <text x="1152" y="122" font-size="50" font-weight="800" fill="#fff">פירוק גימבל</text>
  <text x="48" y="122" font-size="20" font-weight="600" fill="#fff" opacity="0.85" text-anchor="end">4 רכיבים</text>
  
  <g>
    <rect x="612" y="206" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="1082" cy="276" r="46" fill="#FFF0E6"/>
    <g transform="translate(1050 244)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="23" y="8" width="18" height="6" rx="2"/><path d="M32 14 V20 H52 V42 H46"/><rect x="16" y="32" width="30" height="20" rx="5"/><circle cx="29" cy="42" r="6"/></g></g>
    <text x="1014" y="252" font-size="25" font-weight="700" fill="#0B2149">גימבל</text>
    <text x="1014" y="286" font-size="19" fill="#475569">מתקן ממונע שמחזיק את המצלמה ומייצב</text>
    <text x="1014" y="314" font-size="19" fill="#475569">אותה בזמן הטיסה.</text>
  </g>

  <g>
    <rect x="48" y="206" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="276" r="46" fill="#FFF0E6"/>
    <g transform="translate(486 244)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="8" width="24" height="11" rx="4"/><line x1="28" y1="13.5" x2="36" y2="13.5"/><path d="M27 19 V48 L32 56 L37 48 V19"/><line x1="27" y1="27" x2="37" y2="23"/><line x1="27" y1="35" x2="37" y2="31"/><line x1="27" y1="43" x2="37" y2="39"/></g></g>
    <text x="450" y="252" font-size="25" font-weight="700" fill="#0B2149">ברגי קפיץ (2)</text>
    <text x="450" y="286" font-size="19" fill="#475569">ברגים שמשתחררים אבל נשארים במקום —</text>
    <text x="450" y="314" font-size="19" fill="#475569">הם לא אמורים לצאת החוצה.</text>
  </g>

  <g>
    <rect x="612" y="370" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
