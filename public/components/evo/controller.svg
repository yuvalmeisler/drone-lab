<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 886" width="1200" height="886" direction="rtl" font-family="'Google Sans', 'Noto Sans Hebrew', 'Segoe UI', Arial, sans-serif" text-anchor="start">
  <title>רכיבים בפירוק · פירוק שלט · EVO</title>
  <rect width="1200" height="886" fill="#F4F7FC"/>
  <rect width="1200" height="170" fill="#F46A1F"/>
  <circle cx="90" cy="20" r="140" fill="#fff" opacity="0.08"/>
  <circle cx="230" cy="190" r="90" fill="#fff" opacity="0.07"/>
  <text x="1152" y="62" font-size="22" font-weight="700" fill="#fff" opacity="0.85">רכיבים בפירוק · ⁨EVO⁩</text>
  <text x="1152" y="122" font-size="50" font-weight="800" fill="#fff">פירוק שלט</text>
  <text x="48" y="122" font-size="20" font-weight="600" fill="#fff" opacity="0.85" text-anchor="end">6 רכיבים</text>
  
  <g>
    <rect x="612" y="206" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="1082" cy="276" r="46" fill="#FFF0E6"/>
    <g transform="translate(1050 244)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 44 Q14 16 32 16 Q50 16 50 44"/><line x1="8" y1="44" x2="56" y2="44"/><path d="M22 36 Q24 26 30 24" stroke-width="3"/></g></g>
    <text x="1014" y="252" font-size="25" font-weight="700" fill="#0B2149">מעטפת השלט</text>
    <text x="1014" y="286" font-size="19" fill="#475569">שני חלקי פלסטיק שמחוברים בברגים</text>
    <text x="1014" y="314" font-size="19" fill="#475569">ובתפסים — נפתחים לאט, לאורך כל התפר.</text>
  </g>

  <g>
    <rect x="48" y="206" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="276" r="46" fill="#FFF0E6"/>
    <g transform="translate(486 244)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="52" rx="16" ry="5"/><line x1="32" y1="52" x2="32" y2="24"/><circle cx="32" cy="17" r="8"/></g></g>
    <text x="450" y="252" font-size="25" font-weight="700" fill="#0B2149">סטיקים</text>
    <text x="450" y="286" font-size="19" fill="#475569">ידיות השליטה. מתברגות החוצה ונשמרות</text>
    <text x="450" y="314" font-size="19" fill="#475569">בנפרד כדי לא לאבד אותן.</text>
  </g>

  <g>
    <rect x="612" y="370" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="1082" cy="440" r="46" fill="#FFF0E6"/>
    <g transform="translate(1050 408)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="16" width="12" height="16" rx="2"/><rect x="46" y="32" width="12" height="16" rx="2"/><path d="M18 20 C32 20 32 36 46 36"/><path d="M18 28 C32 28 32 44 46 44"/></g></g>
    <text x="1014" y="416" font-size="25" font-weight="700" fill="#0B2149">כבלי סרט</text>
    <text x="1014" y="450" font-size="19" fill="#475569">כבלים שטוחים ועדינים בין חלקי השלט.</text>
    <text x="1014" y="478" font-size="19" fill="#475569">מנתקים עם פינצטה לפני ההפרדה.</text>
  </g>

  <g>
    <rect x="48" y="370" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="440" r="46" fill="#FFF0E6"/>
    <g transform="translate(486 408)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="42" rx="6"/><rect x="24" y="8" width="16" height="6" rx="2"/><polyline points="35,22 27,36 37,36 29,50"/></g></g>
    <text x="450" y="416" font-size="25" font-weight="700" fill="#0B2149">סוללת השלט</text>
    <text x="450" y="450" font-size="19" fill="#475569">סוללת ליתיום. מנתקים אותה ראשונה —</text>
    <text x="450" y="478" font-size="19" fill="#475569">לא מכופפים ולא מנקבים.</text>
  </g>

  <g>
    <rect x="612" y="534" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="1082" cy="604" r="46" fill="#FFF0E6"/>
    <g transform="translate(1050 572)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 52 L44 20 Q50 14 54 18 Q56 22 50 28 L18 58 Z"/><line x1="40" y1="30" x2="46" y2="24"/></g></g>
    <text x="1014" y="580" font-size="25" font-weight="700" fill="#0B2149">מפריד פלסטיק</text>
    <text x="1014" y="614" font-size="19" fill="#475569">כלי פלסטיק לפתיחת התפר בלי לשרוט</text>
    <text x="1014" y="642" font-size="19" fill="#475569">ובלי לשבור את התפסים.</text>
  </g>

  <g>
    <rect x="48" y="534" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="604" r="46" fill="#FFF0E6"/>
    <g transform="translate(486 572)"><g fill="none" stroke="#F46A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="6" width="14" height="24" rx="6"/><line x1="29" y1="12" x2="29" y2="24"/><line x1="35" y1="12" x2="35" y2="24"/><line x1="32" y1="30" x2="32" y2="52"/><line x1="28" y1="56" x2="36" y2="52"/></g></g>
    <text x="450" y="580" font-size="25" font-weight="700" fill="#0B2149">מברג PH00</text>
    <text x="450" y="614" font-size="19" fill="#475569">מברג פיליפס קטן לברגי הגב. ראש לא</text>
    <text x="450" y="642" font-size="19" fill="#475569">מתאים מבריש את הבורג.</text>
  </g>
  <rect x="48" y="706" width="1104" height="132" rx="20" fill="#FFFBF0" stroke="#FCEBC0" stroke-width="2"/>
  <g transform="translate(1088 753)"><path d="M20 3 L38 35 H2 Z" fill="#FFC60A" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/><line x1="20" y1="14" x2="20" y2="24" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="30" r="2.2" fill="#78350F"/></g>
  <text x="1068" y="754" font-size="22" font-weight="800" fill="#78350F">תזכורת בטיחות — עוצרים ובודקים לפני שמתחילים</text><text x="1068" y="788" font-size="19" fill="#92400E">רחפן כבוי וסוללה בחוץ לפני כל מגע · עובדים עם הכלי המתאים ובלי כוח · כל בורג חוזר למקומו · לא</text><text x="1068" y="816" font-size="19" fill="#92400E">נוגעים בעדשה ובמגעים</text>
</svg>
