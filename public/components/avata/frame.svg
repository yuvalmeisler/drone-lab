    <circle cx="1082" cy="636" r="46" fill="#F1EDFF"/>
    <g transform="translate(1050 604)"><g fill="none" stroke="#7C5CFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="14" y1="14" x2="50" y2="50"/><line x1="50" y1="14" x2="14" y2="50"/><circle cx="14" cy="14" r="6" fill="#fff"/><circle cx="50" cy="14" r="6" fill="#fff"/><circle cx="14" cy="50" r="6" fill="#fff"/><circle cx="50" cy="50" r="6" fill="#fff"/><rect x="23" y="23" width="18" height="18" rx="5" fill="#fff"/></g></g>
