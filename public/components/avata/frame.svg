  <text x="1152" y="62" font-size="22" font-weight="700" fill="#fff" opacity="0.85">רכיבים בפירוק · ⁨AVATA⁩</text>
  <text x="1152" y="122" font-size="50" font-weight="800" fill="#fff">פירוק שלדה</text>
  <text x="48" y="122" font-size="20" font-weight="600" fill="#fff" opacity="0.85" text-anchor="end">6 רכיבים</text>
  
  <g>
    <rect x="612" y="206" width="540" height="172" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
