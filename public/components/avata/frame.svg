    <text x="450" y="612" font-size="25" font-weight="700" fill="#0B2149">מברג דיוק</text>
    <text x="450" y="646" font-size="19" fill="#475569">מברג קטן שמתאים בדיוק לראש הבורג —</text>
    <text x="450" y="674" font-size="19" fill="#475569">כדי לא להבריש אותו.</text>
  </g>
  <rect x="48" y="738" width="1104" height="132" rx="20" fill="#FFFBF0" stroke="#FCEBC0" stroke-width="2"/>
  <g transform="translate(1088 785)"><path d="M20 3 L38 35 H2 Z" fill="#FFC60A" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/><line x1="20" y1="14" x2="20" y2="24" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="30" r="2.2" fill="#78350F"/></g>
  <text x="1068" y="786" font-size="22" font-weight="800" fill="#78350F">תזכורת בטיחות — עוצרים ובודקים לפני שמתחילים</text><text x="1068" y="820" font-size="19" fill="#92400E">רחפן כבוי וסוללה בחוץ לפני כל מגע · עובדים עם הכלי המתאים ובלי כוח · כל בורג חוזר למקומו · לא</text><text x="1068" y="848" font-size="19" fill="#92400E">נוגעים בעדשה ובמגעים</text>
