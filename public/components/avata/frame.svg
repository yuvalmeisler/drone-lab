    <text x="450" y="252" font-size="25" font-weight="700" fill="#0B2149">ברגי הרכיב (2)</text>
    <text x="450" y="286" font-size="19" fill="#475569">מחזיקים את הרכיב לשלדה. נשמרים</text>
    <text x="450" y="314" font-size="19" fill="#475569">בנפרד — לא מערבבים עם ברגים אחרים.</text>
  </g>

