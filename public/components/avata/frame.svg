    <text x="1014" y="252" font-size="25" font-weight="700" fill="#0B2149">רכיב מערכת העיגון</text>
    <text x="1014" y="284" font-size="25" font-weight="700" fill="#0B2149">הוויזואלי</text>
    <text x="1014" y="318" font-size="19" fill="#475569">חיישנים שעוזרים לרחפן לשמור על</text>
    <text x="1014" y="346" font-size="19" fill="#475569">מיקום יציב ולזהות מכשולים.</text>
