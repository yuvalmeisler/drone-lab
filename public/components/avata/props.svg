    <text x="450" y="252" font-size="25" font-weight="700" fill="#0B2149">ברגי המדחף (2)</text>
    <text x="450" y="286" font-size="19" fill="#475569">מחזיקים את המדחף צמוד למנוע. קטנים</text>
