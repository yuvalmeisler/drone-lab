<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 722" width="1200" height="722" direction="rtl" font-family="'Google Sans', 'Noto Sans Hebrew', 'Segoe UI', Arial, sans-serif" text-anchor="start">
  <title>רכיבים בפירוק · התקנת מצלמה · ALPHA</title>
  <rect width="1200" height="722" fill="#F4F7FC"/>
  <rect width="1200" height="170" fill="#0EA5A4"/>
  <circle cx="90" cy="20" r="140" fill="#fff" opacity="0.08"/>
  <circle cx="230" cy="190" r="90" fill="#fff" opacity="0.07"/>
  <text x="1152" y="62" font-size="22" font-weight="700" fill="#fff" opacity="0.85">רכיבים בפירוק · ⁨ALPHA⁩</text>
  <text x="1152" y="122" font-size="50" font-weight="800" fill="#fff">התקנת מצלמה</text>
  <text x="48" y="122" font-size="20" font-weight="600" fill="#fff" opacity="0.85" text-anchor="end">4 רכיבים</text>
  
  <g>
    <rect x="612" y="206" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="1082" cy="276" r="46" fill="#E4F7F6"/>
    <g transform="translate(1050 244)"><g fill="none" stroke="#0EA5A4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="20" width="44" height="30" rx="6"/><rect x="17" y="14" width="12" height="6" rx="2"/><circle cx="32" cy="35" r="10"/><circle cx="32" cy="35" r="4" fill="#0EA5A4"/></g></g>
    <text x="1014" y="252" font-size="25" font-weight="700" fill="#0B2149">מצלמת גימבל</text>
    <text x="1014" y="286" font-size="19" fill="#475569">מטען מתחלף — המצלמה שמתחברת לרחפן</text>
    <text x="1014" y="314" font-size="19" fill="#475569">דרך מחבר מהיר.</text>
  </g>

  <g>
    <rect x="48" y="206" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="276" r="46" fill="#E4F7F6"/>
    <g transform="translate(486 244)"><g fill="none" stroke="#0EA5A4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="16" r="7" fill="#E3132B" stroke="#E3132B"/><circle cx="32" cy="48" r="7" fill="#E3132B" stroke="#E3132B"/><line x1="32" y1="25" x2="32" y2="39" stroke-dasharray="3 4"/></g></g>
    <text x="450" y="252" font-size="25" font-weight="700" fill="#0B2149">נקודות יישור אדומות</text>
    <text x="450" y="286" font-size="19" fill="#475569">נקודה על המצלמה ונקודה על הרחפן.</text>
    <text x="450" y="314" font-size="19" fill="#475569">מיישרים אותן כדי לחבר בכיוון הנכון.</text>
  </g>

  <g>
    <rect x="612" y="370" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="1082" cy="440" r="46" fill="#E4F7F6"/>
    <g transform="translate(1050 408)"><g fill="none" stroke="#0EA5A4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="20" width="44" height="26" rx="7"/><line x1="20" y1="29" x2="20" y2="37"/><line x1="28" y1="29" x2="28" y2="37"/><line x1="36" y1="29" x2="36" y2="37"/><line x1="44" y1="29" x2="44" y2="37"/></g></g>
    <text x="1014" y="416" font-size="25" font-weight="700" fill="#0B2149">ממשק הגימבל</text>
    <text x="1014" y="450" font-size="19" fill="#475569">המחבר שמעביר חשמל ונתונים למצלמה.</text>
    <text x="1014" y="478" font-size="19" fill="#475569">לא נוגעים במגעים.</text>
  </g>

  <g>
    <rect x="48" y="370" width="540" height="140" rx="22" fill="#fff" stroke="#E6ECF5" stroke-width="2"/>
    <circle cx="518" cy="440" r="46" fill="#E4F7F6"/>
    <g transform="translate(486 408)"><g fill="none" stroke="#0EA5A4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 32 A18 18 0 1 1 40 16"/><polyline points="33,11 40,16 35,23"/><circle cx="32" cy="32" r="6" fill="#0EA5A4"/></g></g>
    <text x="450" y="416" font-size="25" font-weight="700" fill="#0B2149">טבעת נעילה</text>
    <text x="450" y="450" font-size="19" fill="#475569">מסובבים עד שנשמע קליק — הקליק מאשר</text>
    <text x="450" y="478" font-size="19" fill="#475569">שהמצלמה נעולה.</text>
  </g>
  <rect x="48" y="542" width="1104" height="132" rx="20" fill="#FFFBF0" stroke="#FCEBC0" stroke-width="2"/>
  <g transform="translate(1088 589)"><path d="M20 3 L38 35 H2 Z" fill="#FFC60A" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/><line x1="20" y1="14" x2="20" y2="24" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="30" r="2.2" fill="#78350F"/></g>
  <text x="1068" y="590" font-size="22" font-weight="800" fill="#78350F">תזכורת בטיחות — עוצרים ובודקים לפני שמתחילים</text><text x="1068" y="624" font-size="19" fill="#92400E">רחפן כבוי וסוללה בחוץ לפני כל מגע · עובדים עם הכלי המתאים ובלי כוח · כל בורג חוזר למקומו · לא</text><text x="1068" y="652" font-size="19" fill="#92400E">נוגעים בעדשה ובמגעים</text>
